<div class="page-header">
  <h1>Photos</h1>
</div>

<div class="card upload-card">
  <h2>Upload Photo</h2>
  <form [formGroup]="uploadForm" (ngSubmit)="upload()" class="upload-form">
    <div class="upload-field">
      <label for="file">Image</label>
      <input id="file" type="file" accept="image/*" (change)="onFileSelected($event)" />
    </div>

    <div class="upload-field">
      <label for="alt">Alt text</label>
      <input id="alt" type="text" formControlName="alt" placeholder="Description for accessibility" />
    </div>

    <div class="upload-field">
      <label for="caption">Caption</label>
      <input id="caption" type="text" formControlName="caption" placeholder="Optional caption" />
    </div>

    @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
    }

    <button type="submit" class="btn" [disabled]="uploading()">
      {{ uploading() ? 'Uploading…' : 'Upload' }}
    </button>
  </form>
</div>

@if (loading()) {
  <p>Loading…</p>
} @else if (photos().length === 0) {
  <p>No photos yet. Upload one above.</p>
} @else {
  <div class="photo-grid">
    @for (photo of photos(); track photo.id; let i = $index) {
      <div class="card photo-card">
        <img [src]="photo.url" [alt]="photo.alt ?? ''" loading="lazy" (error)="onImageError($event)" />

        <label>Alt text</label>
        <input
          type="text"
          [value]="photo.alt ?? ''"
          (change)="updateField(photo, 'alt', $any($event.target).value)"
        />

        <label>Caption</label>
        <input
          type="text"
          [value]="photo.caption ?? ''"
          (change)="updateField(photo, 'caption', $any($event.target).value)"
        />

        <div class="photo-actions">
          <button type="button" class="btn btn-ghost btn-sm" (click)="moveUp(i)" [disabled]="i === 0">
            ↑
          </button>
          <button
            type="button"
            class="btn btn-ghost btn-sm"
            (click)="moveDown(i)"
            [disabled]="i === photos().length - 1"
          >
            ↓
          </button>
          <button type="button" class="btn btn-danger btn-sm" (click)="remove(photo)">Delete</button>
        </div>
      </div>
    }
  </div>
}
