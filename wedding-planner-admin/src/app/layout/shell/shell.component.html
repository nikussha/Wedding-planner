<div class="shell" [class.sidebar-open]="sidebarOpen()">
  <header class="topbar">
    <button
      type="button"
      class="topbar__toggle"
      (click)="toggleSidebar()"
      [class.is-open]="sidebarOpen()"
      [attr.aria-expanded]="sidebarOpen()"
      aria-controls="admin-sidebar"
      aria-label="Toggle navigation menu"
    >
      <span class="topbar__toggle-bar"></span>
      <span class="topbar__toggle-bar"></span>
      <span class="topbar__toggle-bar"></span>
    </button>
    <span class="topbar__title">Wedding Planner Admin</span>
  </header>

  <div class="sidebar-backdrop" (click)="closeSidebar()" aria-hidden="true"></div>

  <aside class="sidebar" id="admin-sidebar">
    <div class="brand">
      <span class="brand-mark">WP</span>
      <span class="brand-name">Wedding Planner Admin</span>
    </div>

    <nav class="nav">
      @for (link of navLinks; track link.path) {
        <a [routerLink]="link.path" routerLinkActive="active" class="nav-link" (click)="closeSidebar()">{{ link.label }}</a>
      }
    </nav>

    <div class="sidebar-footer">
      @if (user()) {
        <div class="user-info">
          <span class="user-name">{{ user()!.name }}</span>
          <span class="user-email">{{ user()!.email }}</span>
        </div>
      }
      <button type="button" class="btn btn-outline btn-sm logout-btn" (click)="logout()">Logout</button>
    </div>
  </aside>

  <main class="content">
    <router-outlet />
  </main>
</div>
